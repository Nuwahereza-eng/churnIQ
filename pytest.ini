[pytest]
testpaths = tests backend/tests
addopts = -p no:cacheprovider
filterwarnings =
    # emitted by scikit-learn internals during nested parallel CV; harmless
    ignore:`sklearn.utils.parallel.delayed` should be used:UserWarning
    # Starlette suggests a future httpx2 package for its TestClient; not relevant here
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore::DeprecationWarning:starlette.testclient
